name: One-time decouple in-call SMS
on:
  push:
    paths:
      - '.github/workflows/one-time-decouple-in-call-sms.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decouple customer-requested SMS from follow-up preference
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/callProvider.server.ts')
          s = p.read_text()

          old_gate = '''  const smsEnabled =
    smsFeatureAllowedByPlan &&
    Boolean(playbook.followupSmsEnabled) &&
    hasSmsTransport &&
    Boolean(compactRecoveryUrl) &&
    Boolean(customerNumber);'''
          new_gate = '''  // Customer-requested SMS during a live call is separate from automated
  // post-call follow-up SMS. Keep the real-time offer tool available whenever
  // the shop plan and SMS transport support it and this checkout is sendable.
  const smsEnabled =
    smsFeatureAllowedByPlan &&
    hasSmsTransport &&
    Boolean(compactRecoveryUrl) &&
    Boolean(customerNumber);'''
          if old_gate not in s:
              raise SystemExit('Expected smsEnabled gate not found')
          s = s.replace(old_gate, new_gate, 1)

          old_playbook = '''        freeShippingEnabled: Boolean(extras?.free_shipping_enabled ?? false),
        followupSmsEnabled: smsFeatureAllowedByPlan && Boolean(extras?.followup_sms_enabled ?? false),
      };

      if (!playbook.followupSmsEnabled) throw new Error("SMS follow-up is disabled for this shop.");'''
          new_playbook = '''        freeShippingEnabled: Boolean(extras?.free_shipping_enabled ?? false),
      };

      // This tool sends an SMS explicitly requested by the customer during
      // the call. The followup_sms_enabled preference controls automated
      // follow-ups only, so it must not block this live-call delivery path.'''
          if old_playbook not in s:
              raise SystemExit('Expected tool-handler follow-up SMS gate not found')
          s = s.replace(old_playbook, new_playbook, 1)

          p.write_text(s)
          PY
      - name: Verify targeted SMS wiring
        run: |
          grep -n "const smsEnabled" app/callProvider.server.ts
          grep -n "followupSmsEnabled) throw" app/callProvider.server.ts && exit 1 || true
      - name: Commit patch
        run: |
          git config user.name "CheckoutCall AI"
          git config user.email "actions@users.noreply.github.com"
          git add app/callProvider.server.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Decouple in-call SMS offers from follow-up setting"
            git push
          fi
name: Run SMS patch on issue

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == '[RUN] SMS 100'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply SMS 100 patch
        run: python .github/scripts/patch_sms_100.py

      - name: Validate diff
        run: git diff --check

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/routes/app.settings.tsx app/callProvider.server.ts
          git commit -m 'Limit SMS templates to 100 chars and always send'
          git push origin HEAD:main

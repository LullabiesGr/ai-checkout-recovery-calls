name: Restore working in-call SMS

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == '[RUN] RESTORE 14:24 SMS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore working live-call SMS flow
        run: python .github/scripts/patch_sms_100.py

      - name: Validate diff
        run: git diff --check

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/callProvider.server.ts
          git commit -m 'Restore working live-call SMS flow'
          git push origin HEAD:main

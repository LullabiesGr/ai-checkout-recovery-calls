name: One-time restore Shopify recovery SMS URLs
on:
  push:
    paths:
      - '.github/workflows/one-time-revert-short-sms-url.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore direct Shopify recovery URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/callProvider.server.ts')
          s = p.read_text()

          s = s.replace(
              '      const compactLink = shortRecoveryUrl(job.id) || compactCheckoutUrl(recoveryUrl);',
              '      const compactLink = compactCheckoutUrl(recoveryUrl);'
          )
          s = s.replace(
              '          discountLink = `${compactLink}?c=${encodeURIComponent(offerCode)}`;',
              '          discountLink = checkoutUrlWithOfferCode(compactLink, offerCode);'
          )
          s = s.replace(
              '  const compactRecoveryUrl = recoveryUrl ? (shortRecoveryUrl(job.id) || compactCheckoutUrl(recoveryUrl)) : null;',
              '  const compactRecoveryUrl = recoveryUrl ? compactCheckoutUrl(recoveryUrl) : null;'
          )

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "Beautio"
          git config user.email "info@lullabies.gr"
          git add app/callProvider.server.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Restore direct Shopify recovery links in SMS"
            git push
          fi
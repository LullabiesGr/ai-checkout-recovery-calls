name: Apply attempts billing and universal SMS

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == '[RUN] ATTEMPTS SMS ALL PLANS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/attempts_sms_all_plans_patch.py

      - name: Validate
        run: |
          git diff --check
          npm install
          npx prisma generate
          npm run build

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/planFeatures.server.ts app/lib/billingPlans.shared.ts app/lib/billing.server.ts app/routes/app.billing.tsx app/routes/app.settings.tsx app/routes/app.calls.tsx app/components/calls/CallActivityView.tsx app/callProvider.server.ts app/routes/webhooks.vapi.tsx
          git commit -m 'Use attempt billing and enable SMS on every plan'
          git push origin HEAD:main

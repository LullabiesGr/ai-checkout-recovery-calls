name: Fix free attempt cycle

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == '[RUN] FIX FREE ATTEMPT CYCLE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Apply patch
        run: python .github/scripts/free_attempt_cycle_fix.py
      - name: Validate
        run: |
          git diff --check
          npm install
          npx prisma generate
          npm run build
      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/billing.server.ts
          git commit -m 'Reset free attempts on the free billing cycle'
          git push origin HEAD:main

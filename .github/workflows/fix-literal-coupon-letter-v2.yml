name: Fix literal coupon letter v2
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-literal-coupon-letter-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/callProvider.server.ts')
          s = p.read_text()
          old = 'if (/[A-Z]/.test(ch)) return natoWord(ch);'
          new = 'if (/[A-Z]/.test(ch)) return ch;'
          if old not in s:
              raise SystemExit('pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/callProvider.server.ts
          git commit -m "Pronounce coupon letters literally"
          git push origin HEAD:main
